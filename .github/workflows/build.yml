name: build

# Cross-platform static builds of tokscale-client.
# Static-linking strategy per platform:
#   linux   x86_64-unknown-linux-musl   fully static (musl libc, no glibc dependency)
#   windows x86_64-pc-windows-msvc      static CRT (+crt-static, no VC++ redist needed)
#   macos   aarch64 / x86_64            Apple forbids fully static binaries; everything
#                                       except libSystem is linked statically (standard practice)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN: tokscale-client

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master # reads rust-toolchain.toml (1.98)

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: Run tests
        run: cargo test --workspace --locked

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install musl cross toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master # reads rust-toolchain.toml (1.98)
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}

      - name: Static CRT (Windows MSVC)
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "RUSTFLAGS=-C target-feature=+crt-static"

      - name: musl cross compiler env
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p tokscale-client --target ${{ matrix.target }}

      - name: Verify fully static (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file "target/${{ matrix.target }}/release/$BIN"
          file "target/${{ matrix.target }}/release/$BIN" | grep -q "statically linked"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release"
          strip "$BIN" || true
          tar czf "$GITHUB_WORKSPACE/$BIN-${{ matrix.target }}.tar.gz" "$BIN"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Force -Path "target/${{ matrix.target }}/release/${{ env.BIN }}.exe" -DestinationPath "${{ env.BIN }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: "${{ env.BIN }}-${{ matrix.target }}.*"
          retention-days: 14

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN }}-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: "${{ env.BIN }}-*"
          generate_release_notes: true
