name: build

# Cross-platform static builds of tokscale-client.
# Static-linking strategy per platform:
#   linux   x86_64-unknown-linux-musl   fully static (musl libc, no glibc dependency)
#   windows x86_64-pc-windows-msvc      static CRT (+crt-static, no VC++ redist needed)
#   macos   aarch64 / x86_64            native binaries using macOS system libraries

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded branch/PR builds, but let tag releases finish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: "1.98" # Keep in sync with rust-toolchain.toml.
  BIN: tokscale-client

jobs:
  check:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test calibration reference with synthetic data
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - name: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install musl cross toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools musl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Static CRT (Windows MSVC)
        if: runner.os == 'Windows'
        run: Add-Content $env:GITHUB_ENV "RUSTFLAGS=-C target-feature=+crt-static"

      - name: musl cross compiler env
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"

      - name: macOS minimum version
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

      # Cache keys must see the same compiler flags as the build below.
      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}
          env-vars: "CARGO CC CFLAGS CXX CMAKE RUST MACOSX_DEPLOYMENT_TARGET"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Exercise configuration persistence and CLI startup on the native OS
      # and architecture before publishing that platform's executable.
      - name: Run tests on release target
        run: cargo test --release --workspace --locked --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p tokscale-client --target ${{ matrix.target }}

      - name: Verify fully static (musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file "target/${{ matrix.target }}/release/$BIN"
          file "target/${{ matrix.target }}/release/$BIN" | grep -Eq '(statically linked|static-pie linked)'

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "target/${{ matrix.target }}/release"
          strip "$BIN"
          tar czf "$GITHUB_WORKSPACE/$BIN-${{ matrix.target }}.tar.gz" "$BIN"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Force -Path "target/${{ matrix.target }}/release/${{ env.BIN }}.exe" -DestinationPath "${{ env.BIN }}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: "${{ env.BIN }}-${{ matrix.target }}.${{ matrix.archive }}"
          compression-level: 0 # The tar.gz/zip payload is already compressed.
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ env.BIN }}-*
          merge-multiple: true

      - name: Generate release checksums
        run: sha256sum "$BIN"-*.tar.gz "$BIN"-*.zip > SHA256SUMS

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: |
            ${{ env.BIN }}-*.tar.gz
            ${{ env.BIN }}-*.zip
            SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
